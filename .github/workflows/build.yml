name: build

# Builds the Vexa Transcoder with build.sh for every platform and, on a v* tag, publishes the release assets
# (standard FFmpeg build naming):
#   vexa-transcoder_<ver>_portable_linux64-gpl.tar.xz     vexa-transcoder_<ver>_portable_linuxarm64-gpl.tar.xz
#   vexa-transcoder_<ver>_portable_win64-clang-gpl.zip    vexa-transcoder_<ver>_portable_winarm64-clang-gpl.zip
#   vexa-transcoder_<ver>_portable_mac64-gpl.tar.xz       vexa-transcoder_<ver>_portable_macarm64-gpl.tar.xz
#   vexa-transcoder_<ver>-<codename>_<amd64|arm64>.deb   for bookworm, trixie, jammy, noble and resolute
# Linux is fully static, so each architecture is built once (inside Debian 13, where the recipe is validated) and the
# same binary goes into the portable archive and every .deb. Windows is cross-compiled there too (llvm-mingw) and then
# run on real Windows machines; macOS is built on macOS (only system libraries stay dynamic).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEB_CODENAMES: bookworm trixie jammy noble resolute

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:13
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04,     portable: linux64,    deb: amd64 }
          - { arch: arm64,  runner: ubuntu-24.04-arm, portable: linuxarm64, deb: arm64 }
    steps:
      - name: Build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake meson ninja-build autoconf automake libtool pkg-config gettext autopoint \
            git curl ca-certificates patch perl nasm python3 file xz-utils
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-linux-${{ hashFiles('VERSIONS') }}
      - name: Build
        run: ./build.sh
      - name: Check
        run: .github/check.sh dist/vexa-transcoder
      - name: Package
        run: |
          . ./VERSIONS
          ver=$VEXA_VERSION
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver=${GITHUB_REF_NAME#v}; fi
          name=vexa-transcoder_${ver}_portable_${{ matrix.portable }}-gpl
          mkdir -p "pkg/$name" out
          cp dist/vexa-transcoder dist/vexa-probe LICENSE README.md VERSIONS "pkg/$name/"
          tar -C pkg -cJf "out/$name.tar.xz" "$name"
          .github/deb.sh "$ver" ${{ matrix.deb }} out $DEB_CODENAMES
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  windows:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: [win64, winarm64]
    steps:
      - name: Build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake meson ninja-build autoconf automake libtool pkg-config gettext autopoint \
            git curl ca-certificates patch perl nasm python3 file xz-utils zip
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-windows-${{ hashFiles('VERSIONS') }}
      - name: Build
        run: TARGET=${{ matrix.target }} ./build.sh
      - name: Package
        run: |
          . ./VERSIONS
          ver=$VEXA_VERSION
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver=${GITHUB_REF_NAME#v}; fi
          name=vexa-transcoder_${ver}_portable_${{ matrix.target }}-clang-gpl
          mkdir -p "pkg/$name" out
          cp dist-${{ matrix.target }}/vexa-transcoder.exe dist-${{ matrix.target }}/vexa-probe.exe LICENSE README.md VERSIONS "pkg/$name/"
          (cd pkg && zip -qr9 "../out/$name.zip" "$name")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # the cross-compiled binaries, run on real Windows
  windows-test:
    name: ${{ matrix.target }}-test
    needs: windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win64,    runner: windows-2025 }
          - { target: winarm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out
      - name: Check
        run: |
          cd out && unzip -q *.zip && cd ..
          .github/check.sh "$(ls out/*/vexa-transcoder.exe)"

  macos:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macarm64, runner: macos-15 }
          - { target: mac64,    runner: macos-15-intel }
    steps:
      - name: Build tools
        run: brew install autoconf automake libtool meson ninja nasm pkgconf gperf || true
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: deps
          key: deps-macos-${{ hashFiles('VERSIONS') }}
      - name: Build
        run: ./build.sh
      - name: Check
        run: .github/check.sh dist/vexa-transcoder
      - name: Package
        run: |
          . ./VERSIONS
          ver=$VEXA_VERSION
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver=${GITHUB_REF_NAME#v}; fi
          name=vexa-transcoder_${ver}_portable_${{ matrix.target }}-gpl
          mkdir -p "pkg/$name" out
          cp dist/vexa-transcoder dist/vexa-probe LICENSE README.md VERSIONS "pkg/$name/"
          tar -C pkg -cJf "out/$name.tar.xz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows, windows-test, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum * >SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "Vexa Transcoder ${GITHUB_REF_NAME#v}" \
            --notes "Vexa Transcoder ${GITHUB_REF_NAME#v}: FFmpeg built for Vexa Media, with its streaming, subtitle and server-reporting extensions. Linux binaries are fully static; the .deb packages carry the same binary for each distribution. See README.md."
